<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 6 · Service Desk Join Lab</title><link rel="stylesheet" href="styles.css"></head><body><header><b>AI Vibe Coding for SQL</b><h1>Lab 6 · Service Desk Join Lab</h1><p>Combine tickets, requesters and agents without losing unassigned tickets.</p></header><main class="wrap"><div class="status" id="status">Loading SQLite…</div><div class="grid"><section class="card"><h2>Service tickets</h2><form id="ticket-form" class="row"><input id="subject" placeholder="Ticket subject" required><select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select><button>Create ticket</button></form><div id="items"></div></section><section class="card"><h2>SQL console</h2><textarea id="sql">SELECT t.id,t.subject,r.name requester,a.name agent,ROUND((julianday(&#x27;now&#x27;)-julianday(t.created_at))*24,1) age_hours FROM tickets t JOIN people r ON r.id=t.requester_id LEFT JOIN people a ON a.id=t.agent_id ORDER BY (age_hours&gt;24) DESC,age_hours DESC;</textarea><div class="row"><button id="run">Run query</button><button id="export">Export .db</button><label><input id="import" type="file" accept=".db"> Import .db</label></div><div id="results"></div></section></div><p><a href="README.md">Detailed lab guide</a> · <a href="PROMPTS.md">AI prompt contract</a></p></main><footer>Powered by Tertiary Infotech Pte Ltd</footer><script src="vendor/sql-wasm.js"></script><script>window.LAB_MODE='tickets';</script><script src="app.js"></script></body></html>
