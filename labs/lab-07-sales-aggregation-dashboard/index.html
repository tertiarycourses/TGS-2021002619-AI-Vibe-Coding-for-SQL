<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab 7 · Sales Aggregation Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><header><b>AI Vibe Coding for SQL</b><h1>Lab 7 · Sales Aggregation Dashboard</h1><p>Create management KPIs from order-line data at a declared grain.</p></header><main class="wrap"><div class="status" id="status">Loading SQLite…</div><div class="grid"><section class="card"><h2>Live metrics</h2><div id="metrics" class="grid"></div><div id="items"></div></section><section class="card"><h2>SQL console</h2><textarea id="sql">WITH line AS (SELECT oi.order_id,p.category,oi.qty*oi.unit_price amount FROM order_items oi JOIN products p ON p.id=oi.product_id) SELECT category,ROUND(SUM(amount),2) revenue,COUNT(DISTINCT order_id) orders FROM line GROUP BY category ORDER BY revenue DESC;</textarea><div class="row"><button id="run">Run query</button><button id="export">Export .db</button><label><input id="import" type="file" accept=".db"> Import .db</label></div><div id="results"></div></section></div><p><a href="README.md">Detailed lab guide</a> · <a href="PROMPTS.md">AI prompt contract</a></p></main><footer>Powered by Tertiary Infotech Pte Ltd</footer><script src="vendor/sql-wasm.js"></script><script>window.LAB_MODE='dashboard';</script><script src="app.js"></script></body></html>
